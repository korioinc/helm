{{- if not .Values.auth.existingSecret }}
{{- $name := include "magpie.webuiSecretName" . }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- $owned := false }}
{{- if $secret }}
  {{- $data = default (dict) $secret.data }}
  {{- $key := required (printf "Secret %s must contain auth.webKeySecretKey %s; refusing to replace an existing credential" $name .Values.auth.webKeySecretKey) (index $data .Values.auth.webKeySecretKey) }}
  {{- if not (regexMatch "^[A-Za-z0-9._~-]{16,}$" ($key | b64dec)) }}
    {{- fail (printf "Secret %s field %s must contain at least 16 URL-safe characters (letters, digits, -._~); refusing to replace it" $name .Values.auth.webKeySecretKey) }}
  {{- end }}
  {{- $labels := default (dict) $secret.metadata.labels }}
  {{- $annotations := default (dict) $secret.metadata.annotations }}
  {{- $owned = and (eq (index $labels "app.kubernetes.io/managed-by") .Release.Service) (eq (index $annotations "meta.helm.sh/release-name") .Release.Name) (eq (index $annotations "meta.helm.sh/release-namespace") .Release.Namespace) }}
  {{- if and (not $owned) (or (eq (index $labels "app.kubernetes.io/managed-by") "Helm") (index $annotations "meta.helm.sh/release-name") (index $annotations "meta.helm.sh/release-namespace")) }}
    {{- fail (printf "Secret %s has different Helm ownership; set auth.existingSecret explicitly to reuse it without managing it" $name) }}
  {{- end }}
{{- else }}
  {{- $_ := set $data .Values.auth.webKeySecretKey (randAlphaNum 48 | b64enc) }}
{{- end }}
{{- /* Do not adopt or modify an existing externally managed Secret. */}}
{{- if or (not $secret) $owned }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
type: Opaque
{{- if and $secret (hasKey $secret "immutable") }}
immutable: {{ $secret.immutable }}
{{- end }}
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
{{- end }}
