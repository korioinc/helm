replicaCount: 1
imagePullSecrets: []
multica:
  baseURL: https://multica.example.com
  controllerTokenSecret: {name: multica-runtime-controller-token, key: token}
runtime:
  name: runtime-controller
  image:
    # Required: a digest of the new contract-version-1 core artifact.
    reference: ""
    pullPolicy: IfNotPresent
  capacity: 20
  pollInterval: 10s
  heartbeatInterval: 15s
environment:
  image:
    reference: docker.io/library/buildpack-deps:bookworm-scm@sha256:4274ea4975976f86239384ac206f98af5f0978fd8f054886eec1371fc7664025
    pullPolicy: IfNotPresent
  platform: linux/amd64
  providers: [pi, codex, copilot, antigravity]
  bootstrap:
    source: bundled
    revision: default-1
    script: ""
    configMap: {name: "", key: "", sha256: ""}
    env: {}
    secretEnvFrom: []
    timeout: 1200
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 4Gi}
  storage: {existingClaim: "", size: 20Gi, storageClass: "", accessMode: ReadWriteMany}
workspace:
  storage: {existingClaim: "", size: 100Gi, storageClass: "", accessMode: ReadWriteMany}
operator:
  # Controller/provider/task configuration; never supplied to bootstrap.
  envFrom: []
  env: []
  configVolumes: []
  configMounts: []
controller:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
worker:
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 4Gi}
  taskDeadline: 21600
  terminationGraceSeconds: 10
scheduling:
  nodeSelector: {}
  tolerations: []
  # Node metadata.name; required if either PVC uses ReadWriteOnce.
  singleNodeName: ""
podDisruptionBudget: {enabled: true, maxUnavailable: 1}
networkPolicy: {enabled: true}
