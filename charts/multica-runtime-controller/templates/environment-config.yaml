{{- include "multica-runtime-controller.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "multica-runtime-controller.fullname" . }}-environment
  labels:
    {{- include "multica-runtime-controller.labels" . | nindent 4 }}
data:
  input.json: {{ include "multica-runtime-controller.environmentInput" . | quote }}
{{- if ne .Values.environment.bootstrap.source "configMap" }}
  bootstrap.sh: {{ include "multica-runtime-controller.bootstrapScript" . | quote }}
{{- end }}
