apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multica-runtime-controller.fullname" . }}
  labels:
    {{- include "multica-runtime-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "multica-runtime-controller.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
        {{- $fixed := dict "multica.io/environment-id" (include "multica-runtime-controller.environmentID" .) "checksum/worker-config" (include (print $.Template.BasePath "/worker-config.yaml") . | sha256sum) "checksum/config" (include (print $.Template.BasePath "/environment-config.yaml") . | sha256sum) }}
        {{- merge $fixed .Values.controller.podAnnotations | toYaml | nindent 8 }}
      labels:
        app.kubernetes.io/name: {{ include "multica-runtime-controller.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: controller
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "multica-runtime-controller.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- include "multica-runtime-controller.nodeSelector" . | fromJson | toYaml | nindent 8 }}
      {{- with .Values.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.singleNodeName }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchFields:
                  - key: metadata.name
                    operator: In
                    values: [{{ . | quote }}]
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: core-materialize
          image: {{ .Values.runtime.image.reference | quote }}
          imagePullPolicy: {{ .Values.runtime.image.pullPolicy }}
          command: ["/artifact/runtime", "materialize"]
          env:
            {{- include "multica-runtime-controller.environmentEnv" . | nindent 12 }}
            - name: MULTICA_TOOLS_STORE
              value: /tools-store
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            {{- include "multica-runtime-controller.securityContext" . | nindent 12 }}
          volumeMounts:
            - {name: core, mountPath: /opt/multica/core}
            - {name: tools, mountPath: /tools-store}
            - {name: environment-config, mountPath: /etc/multica/environment, readOnly: true}
        - name: workspace-layout
          image: {{ .Values.environment.image.reference | quote }}
          imagePullPolicy: {{ .Values.environment.image.pullPolicy }}
          command:
            - /opt/multica/core/runtime
            - workspace
            - layout
            {{- range .Values.operator.configMounts }}
            {{- if ne (dir .mountPath) "/home/multica/agents" }}
            - {{ printf "--home-parent=%s" (dir .mountPath) | quote }}
            {{- end }}
            {{- end }}
          env:
            {{- include "multica-runtime-controller.environmentEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            {{- include "multica-runtime-controller.securityContext" . | nindent 12 }}
          volumeMounts:
            - {name: core, mountPath: /opt/multica/core, readOnly: true}
            - {name: workspace, mountPath: /workspace}
            - {name: agent-home, mountPath: /home/multica/agents}
            - {name: environment-config, mountPath: /etc/multica/environment, readOnly: true}
        - name: environment-defaults
          image: {{ .Values.environment.image.reference | quote }}
          imagePullPolicy: {{ .Values.environment.image.pullPolicy }}
          command: ["/opt/multica/core/runtime", "environment", "capture"]
          env:
            - name: MULTICA_ENVIRONMENT_BASE_ENV_FILE
              value: /run/multica/image-env.json
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            {{- include "multica-runtime-controller.securityContext" . | nindent 12 }}
          volumeMounts:
            - {name: core, mountPath: /opt/multica/core, readOnly: true}
            - {name: run, mountPath: /run/multica}
        - name: environment-prepare
          image: {{ .Values.environment.image.reference | quote }}
          imagePullPolicy: {{ .Values.environment.image.pullPolicy }}
          command: ["/opt/multica/core/runtime", "environment", "prepare"]
          {{- with .Values.environment.bootstrap.secretEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "multica-runtime-controller.environmentEnv" . | nindent 12 }}
            - name: MULTICA_ENVIRONMENT_SCRIPT_FILE
              value: /etc/multica/bootstrap/bootstrap.sh
            - name: MULTICA_ENVIRONMENT_BASE_ENV_FILE
              value: /run/multica/image-env.json
            - name: MULTICA_ENVIRONMENT_LOCK_FILE
              value: /run/multica/prepare.lock
            - name: MULTICA_ENVIRONMENT_TIMEOUT_SECONDS
              value: {{ .Values.environment.bootstrap.timeout | quote }}
            - name: HOME
              value: /tmp/bootstrap-home
            - name: TMPDIR
              value: /tmp
          resources:
            {{- toYaml .Values.environment.bootstrap.resources | nindent 12 }}
          securityContext:
            {{- include "multica-runtime-controller.securityContext" . | nindent 12 }}
          volumeMounts:
            - {name: core, mountPath: /opt/multica/core, readOnly: true}
            - name: tools
              mountPath: /opt/multica/environment
              subPath: generations/{{ include "multica-runtime-controller.environmentID" . }}
            - name: tools
              mountPath: /run/multica/prepare.lock
              subPath: locks/{{ include "multica-runtime-controller.environmentID" . }}.lock
            - {name: run, mountPath: /run/multica, readOnly: true}
            - {name: bootstrap-tmp, mountPath: /tmp}
            - {name: environment-config, mountPath: /etc/multica/environment, readOnly: true}
            - {name: bootstrap-script, mountPath: /etc/multica/bootstrap, readOnly: true}
      containers:
        - name: controller
          image: {{ .Values.environment.image.reference | quote }}
          imagePullPolicy: {{ .Values.environment.image.pullPolicy }}
          command: ["/opt/multica/core/runtime", "controller"]
          workingDir: /home/multica/agents
          {{- with .Values.operator.envFrom }}
          envFrom:
            {{- range . }}
            - prefix: {{ printf "MULTICA_OPERATOR_%s" (default "" .prefix) | quote }}
              {{- with .secretRef }}
              secretRef:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .configMapRef }}
              configMapRef:
                {{- toYaml . | nindent 16 }}
              {{- end }}
            {{- end }}
          {{- end }}
          env:
            {{- range .Values.operator.env }}
            - name: {{ printf "MULTICA_OPERATOR_%s" .name | quote }}
              {{- if hasKey . "value" }}
              value: {{ .value | quote }}
              {{- end }}
              {{- with .valueFrom }}
              valueFrom:
                {{- toYaml . | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- include "multica-runtime-controller.environmentEnv" . | nindent 12 }}
            - name: HOME
              value: /home/multica/agents
            - name: TMPDIR
              value: /tmp
            - name: MULTICA_WORKER_CONFIG_FILE
              value: /etc/multica/environment/worker.json
            - name: MULTICA_BASE_URL
              value: {{ .Values.multica.baseURL | quote }}
            - name: MULTICA_DAEMON_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "multica-runtime-controller.identitySecretName" . }}
                  key: daemon-id
            - name: MULTICA_CONTROLLER_TOKEN_FILE
              value: /run/multica/controller/token
            - name: MULTICA_DAEMON_PROXY_URL
              value: {{ printf "http://%s:8080" (include "multica-runtime-controller.daemonProxyServiceName" .) | quote }}
            - name: MULTICA_RUNTIME_NAME
              value: {{ .Values.runtime.name | quote }}
            - name: MULTICA_RUNTIME_CAPACITY
              value: {{ .Values.runtime.capacity | quote }}
            - name: MULTICA_POLL_INTERVAL
              value: {{ .Values.runtime.pollInterval | quote }}
            - name: MULTICA_HEARTBEAT_INTERVAL
              value: {{ .Values.runtime.heartbeatInterval | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: POD_NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - name: POD_UID
              valueFrom:
                fieldRef: {fieldPath: metadata.uid}
          ports:
            - {name: daemon-proxy, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: daemon-proxy}
            initialDelaySeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: daemon-proxy}
            initialDelaySeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            {{- include "multica-runtime-controller.securityContext" . | nindent 12 }}
          volumeMounts:
            - {name: core, mountPath: /opt/multica/core, readOnly: true}
            - name: tools
              mountPath: /opt/multica/environment
              subPath: generations/{{ include "multica-runtime-controller.environmentID" . }}
              readOnly: true
            - {name: environment-config, mountPath: /etc/multica/environment/input.json, subPath: input.json, readOnly: true}
            - {name: worker-config, mountPath: /etc/multica/environment/worker.json, subPath: worker.json, readOnly: true}
            - {name: kube-api-access, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            - {name: controller-token, mountPath: /run/multica/controller, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: run, mountPath: /run/multica}
            - {name: workspace, mountPath: /workspace}
            - {name: agent-home, mountPath: /home/multica/agents}
            - {name: workspace, mountPath: /home/multica/agents/.multica/pi-sessions, subPath: .multica-runtime/sessions}
            {{- with .Values.operator.configMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - {name: core, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - {name: bootstrap-tmp, emptyDir: {}}
        - {name: agent-home, emptyDir: {}}
        - {name: run, emptyDir: {}}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "multica-runtime-controller.workspaceClaimName" . }}
        - name: tools
          persistentVolumeClaim:
            claimName: {{ include "multica-runtime-controller.toolsClaimName" . }}
        - name: worker-config
          secret:
            secretName: {{ include "multica-runtime-controller.fullname" . }}-worker-config
            defaultMode: 0440
        - name: kube-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - {key: ca.crt, path: ca.crt}
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {apiVersion: v1, fieldPath: metadata.namespace}
        - name: controller-token
          secret:
            secretName: {{ .Values.multica.controllerTokenSecret.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.multica.controllerTokenSecret.key }}
                path: token
        - name: environment-config
          configMap:
            name: {{ include "multica-runtime-controller.fullname" . }}-environment
            items:
              - {key: input.json, path: input.json}
        - name: bootstrap-script
          configMap:
            {{- if eq .Values.environment.bootstrap.source "configMap" }}
            name: {{ .Values.environment.bootstrap.configMap.name | quote }}
            items:
              - key: {{ .Values.environment.bootstrap.configMap.key | quote }}
                path: bootstrap.sh
            {{- else }}
            name: {{ include "multica-runtime-controller.fullname" . }}-environment
            items:
              - {key: bootstrap.sh, path: bootstrap.sh}
            {{- end }}
        {{- with .Values.operator.configVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
