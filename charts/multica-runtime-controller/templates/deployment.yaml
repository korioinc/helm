{{- include "multica-runtime-controller.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multica-runtime-controller.fullname" . }}
  labels:
    {{- include "multica-runtime-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "multica-runtime-controller.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
        {{- $fixed := dict "checksum/worker-config" (include (print $.Template.BasePath "/worker-config.yaml") . | sha256sum) }}
        {{- $_ := set $fixed "checksum/nfs-config" (include (print $.Template.BasePath "/nfs-config.yaml") . | sha256sum) }}
        {{- $_ := set $fixed "checksum/controller-rbac" (include (print $.Template.BasePath "/rbac.yaml") . | sha256sum) }}
        {{- merge $fixed .Values.controller.podAnnotations | toYaml | nindent 8 }}
      labels:
        multica.ai/owner-id: {{ include "multica-runtime-controller.ownerID" . | quote }}
        app.kubernetes.io/name: {{ include "multica-runtime-controller.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: controller
    spec:
      hostname: {{ include "multica-runtime-controller.nfsServiceName" . }}
      automountServiceAccountToken: false
      serviceAccountName: {{ include "multica-runtime-controller.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- include "multica-runtime-controller.controllerNodeSelector" . | fromJson | toYaml | nindent 8 }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: home-layout
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
            - /opt/multica/controller/runtime
            - home
            - layout
            - --private-root=/opt/multica/private
            - --storage-root=/opt/multica/storage
            {{- range $mount := .Values.operator.configMounts }}
            {{- $source := printf "/opt/multica/config-input/%s" $mount.name }}
            {{- with $mount.subPath }}{{- $source = printf "%s/%s" $source . }}{{- end }}
            - {{ printf "--config-copy=%s" (dict "sourceGroup" $mount.name "source" $source "target" $mount.mountPath | toJson) | quote }}
            {{- end }}
          env:
            - name: MULTICA_PLATFORM
              value: {{ .Values.platform | quote }}
            - name: POD_UID
              valueFrom:
                fieldRef: {fieldPath: metadata.uid}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            {{- include "multica-runtime-controller.securityContext" . | nindent 12 }}
          volumeMounts:
            - {name: private, mountPath: /opt/multica/private}
            - {name: storage, mountPath: /opt/multica/storage}
            {{- range .Values.operator.configVolumes }}
            - name: {{ .name }}
              mountPath: {{ printf "/opt/multica/config-input/%s" .name | quote }}
              readOnly: true
            {{- end }}
        - name: nfs-layout
          image: {{ .Values.nfs.image | quote }}
          imagePullPolicy: IfNotPresent
          # Preserve the kernel's real filesystem/device identity, without rewriting it.
          command: [/bin/sh, -ec, "grep ' /workspace ' /proc/self/mounts > /run/ganesha/mtab"]
          securityContext:
            {{- include "multica-runtime-controller.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.nfs.resources | nindent 12 }}
          volumeMounts:
            - {name: storage, mountPath: /workspace, subPath: workspace}
            - {name: nfs-run, mountPath: /run/ganesha}
      containers:
        - name: controller
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # The complete runtime image owns its entrypoint initialization.
          args: ["controller"]
          workingDir: /home/multica/agents
          {{- with .Values.operator.envFrom }}
          envFrom:
            {{- range . }}
            - prefix: {{ printf "MULTICA_OPERATOR_%s" (default "" .prefix) | quote }}
              {{- with .secretRef }}
              secretRef:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .configMapRef }}
              configMapRef:
                {{- toYaml . | nindent 16 }}
              {{- end }}
            {{- end }}
          {{- end }}
          env:
            {{- range .Values.operator.env }}
            - name: {{ printf "MULTICA_OPERATOR_%s" .name | quote }}
              {{- if hasKey . "value" }}
              value: {{ .value | quote }}
              {{- end }}
              {{- with .valueFrom }}
              valueFrom:
                {{- toYaml . | nindent 16 }}
              {{- end }}
            {{- end }}
            - name: HOME
              value: /home/multica/agents
            - name: TMPDIR
              value: /tmp
            - name: MULTICA_PLATFORM
              value: {{ .Values.platform | quote }}
            - name: MULTICA_WORKER_CONFIG_FILE
              value: /etc/multica/runtime/worker.json
            - name: MULTICA_BASE_URL
              value: {{ .Values.multica.baseURL | quote }}
            - name: MULTICA_OWNER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "multica-runtime-controller.identitySecretName" . }}
                  key: daemon-id
            - name: MULTICA_DAEMON_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "multica-runtime-controller.identitySecretName" . }}
                  key: daemon-id
            - name: MULTICA_CONTROLLER_TOKEN_FILE
              value: /etc/multica/controller-token/token
            - name: MULTICA_GATEWAY_URL
              value: {{ printf "http://%s.%s.svc:8080" (include "multica-runtime-controller.gatewayServiceName" .) .Release.Namespace | quote }}
            - name: MULTICA_STATE_ROOT
              value: /var/lib/multica/controller
            - name: MULTICA_RUNTIME_NAME
              value: {{ .Values.runtime.name | quote }}
            - name: MULTICA_RUNTIME_CAPACITY
              value: {{ .Values.runtime.capacity | quote }}
            - name: MULTICA_CONVERSATION_IDLE_TIMEOUT
              value: {{ .Values.runtime.conversationIdleTimeout | quote }}
            - name: MULTICA_MAX_RESIDENT_PODS
              value: {{ .Values.runtime.maxResidentPods | quote }}
            - name: MULTICA_POLL_INTERVAL
              value: {{ .Values.runtime.pollInterval | quote }}
            - name: MULTICA_HEARTBEAT_INTERVAL
              value: {{ .Values.runtime.heartbeatInterval | quote }}
            - name: MULTICA_STARTUP_TIMEOUT
              value: {{ .Values.runtime.startupTimeout | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: POD_NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - name: POD_UID
              valueFrom:
                fieldRef: {fieldPath: metadata.uid}
            - name: POD_CONTAINER_NAME
              value: controller
          ports:
            - {name: gateway, containerPort: 8080}
          startupProbe:
            httpGet: {path: /healthz, port: gateway, scheme: HTTP}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: {{ add 6 (int (ceil (divf (include "multica-runtime-controller.startupSeconds" . | float64) 5.0))) }}
          readinessProbe:
            httpGet: {path: /healthz, port: gateway, scheme: HTTP}
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: gateway, scheme: HTTP}
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: worker-config, mountPath: /etc/multica/runtime, readOnly: true}
            - {name: kube-api-access, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            - {name: controller-token, mountPath: /etc/multica/controller-token, readOnly: true}
            - {name: private, mountPath: /tmp, subPath: tmp}
            - {name: private, mountPath: /run/multica, subPath: run}
            - {name: storage, mountPath: /var/lib/multica/controller, subPath: controller}
            - {name: storage, mountPath: /workspace, subPath: workspace}
        - name: nfs
          image: {{ .Values.nfs.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [/usr/bin/ganesha.nfsd]
          args: ["-F", "-L", "/proc/self/fd/2", "-p", "/run/ganesha/ganesha.pid", "-f", "/etc/ganesha/ganesha.conf"]
          ports:
            - {name: nfs, containerPort: 2049, protocol: TCP}
          readinessProbe:
            exec:
              command: [/usr/bin/timeout, "3", /bin/bash, /etc/ganesha/ready.sh]
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.nfs.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
              add: [SYS_ADMIN, DAC_READ_SEARCH, DAC_OVERRIDE, SYS_RESOURCE, CHOWN, FOWNER, SETUID, SETGID]
            seccompProfile: {type: Unconfined}
          volumeMounts:
            - {name: storage, mountPath: /workspace, subPath: workspace}
            - {name: storage, mountPath: /var/lib/nfs/ganesha, subPath: nfs-recovery}
            - {name: nfs-config, mountPath: /etc/ganesha, readOnly: true}
            - {name: nfs-run, mountPath: /run/ganesha}
            - {name: nfs-run, mountPath: /etc/mtab, subPath: mtab, readOnly: true}
        {{- if .Values.packageProxy.enabled }}
        - name: package-proxy
          image: {{ .Values.packageProxy.image | quote }}
          imagePullPolicy: IfNotPresent
          args: [serve]
          env:
            - {name: PROXY_LISTEN, value: ":8081"}
            - name: PROXY_BASE_URL
              value: {{ printf "http://%s:8081" (include "multica-runtime-controller.packageProxyHost" .) | quote }}
            - {name: PROXY_STORAGE_URL, value: "file:///data/artifacts"}
            - {name: PROXY_DATABASE_DRIVER, value: sqlite}
            - {name: PROXY_DATABASE_PATH, value: "/data/proxy.db"}
            - name: PROXY_STORAGE_MAX_SIZE
              value: {{ .Values.packageProxy.maxCacheSize | quote }}
            - {name: PROXY_CACHE_METADATA, value: "true"}
            - {name: PROXY_GRADLE_BUILD_CACHE_READ_ONLY, value: "true"}
            - {name: PROXY_MIRROR_API, value: "false"}
            - {name: PROXY_LOG_FORMAT, value: json}
          ports:
            - {name: packages, containerPort: 8081, protocol: TCP}
          startupProbe:
            tcpSocket: {port: packages}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: packages}
            timeoutSeconds: 11
            periodSeconds: 15
          livenessProbe:
            tcpSocket: {port: packages}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.packageProxy.resources | nindent 12 }}
          securityContext:
            {{- include "multica-runtime-controller.securityContext" . | nindent 12 }}
          volumeMounts:
            - {name: package-proxy-data, mountPath: /data}
        {{- end }}
      volumes:
        {{- if .Values.packageProxy.enabled }}
        - name: package-proxy-data
          persistentVolumeClaim:
            claimName: {{ include "multica-runtime-controller.packageProxyClaimName" . }}
        {{- end }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "multica-runtime-controller.storageClaimName" . }}
        - name: nfs-config
          configMap:
            name: {{ include "multica-runtime-controller.nfsServiceName" . }}
        - {name: nfs-run, emptyDir: {sizeLimit: 16Mi}}
        - {name: private, emptyDir: {}}
        - name: worker-config
          secret:
            secretName: {{ include "multica-runtime-controller.fullname" . }}-worker-config
            defaultMode: 0440
        - name: kube-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - {key: ca.crt, path: ca.crt}
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {apiVersion: v1, fieldPath: metadata.namespace}
        - name: controller-token
          secret:
            secretName: {{ .Values.multica.controllerTokenSecret.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.multica.controllerTokenSecret.key }}
                path: token
        {{- with .Values.operator.configVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
