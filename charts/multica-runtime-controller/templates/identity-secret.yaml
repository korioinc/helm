{{- $name := include "multica-runtime-controller.identitySecretName" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "multica-runtime-controller.labels" . | nindent 4 }}
type: Opaque
stringData:
  daemon-id: {{ include "multica-runtime-controller.ownerID" . | quote }}
