apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "multica-runtime-controller.fullname" . }}
  labels:
    {{- include "multica-runtime-controller.labels" . | nindent 4 }}
rules:
  # The installation volume is created by Helm; the controller only reads identity.
  - apiGroups: [""]
    resources: ["pods"]
    # Patch updates turn annotations and releases the controller's termination-evidence finalizer.
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: [{{ include "multica-runtime-controller.storageClaimName" . | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: [{{ include "multica-runtime-controller.nfsServiceName" . | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "multica-runtime-controller.fullname" . }}
  labels:
    {{- include "multica-runtime-controller.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "multica-runtime-controller.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "multica-runtime-controller.fullname" . }}
