apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "multica-runtime-controller.fullname" . }}
  labels:
    {{- include "multica-runtime-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "multica-runtime-controller.fullname" . }}
  labels:
    {{- include "multica-runtime-controller.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "multica-runtime-controller.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "multica-runtime-controller.fullname" . }}
