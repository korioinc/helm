operator:
  env:
    - {name: GIT_TERMINAL_PROMPT, value: "0"}
  configVolumes:
    - name: provider-config
      configMap:
        name: synthetic-provider-config
        defaultMode: 288
        items:
          - {key: codex, path: codex/config.toml}
          - {key: pi, path: pi/settings.json}
  configMounts:
    - name: provider-config
      mountPath: /home/multica/agents/.codex/config.toml
      subPath: codex/config.toml
      readOnly: true
    - name: provider-config
      mountPath: /home/multica/agents/.pi/agent/settings.json
      subPath: pi/settings.json
      readOnly: true
