name: Lint and Test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Verify runtime image, configuration and storage profiles
        run: scripts/verify-chart.sh --ci
