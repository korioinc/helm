name: Lint Charts

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Lint chart
        # Offline linting cannot discover the cluster's Kubernetes API endpoints.
        run: helm lint charts/multica-runtime-controller --set networkPolicy.blockKubernetesAPI=false
