name: Update Runtime Chart

on:
  repository_dispatch:
    types: [runtime-released]
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-runtime-chart
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Test updater
        run: python3 -m unittest -v scripts.test_update_chart
      - name: Check GHCR and update chart
        id: update
        shell: bash
        run: |
          set -euo pipefail
          result=$(python3 scripts/update_chart.py)
          printf '%s\n' "$result"
          {
            printf 'changed=%s\n' "$(jq -r .changed <<<"$result")"
            printf 'app_version=%s\n' "$(jq -r .app_version <<<"$result")"
            printf 'chart_version=%s\n' "$(jq -r .chart_version <<<"$result")"
          } >>"$GITHUB_OUTPUT"
      - name: Verify updated chart
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          helm lint charts/multica-runtime-controller
          helm template multica-runtime-controller charts/multica-runtime-controller \
            --namespace multica >/tmp/multica-runtime-controller.yaml
          go run github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0 \
            -strict -summary -kubernetes-version 1.36.0 \
            /tmp/multica-runtime-controller.yaml
          helm package charts/multica-runtime-controller --destination /tmp
      - name: Commit update
        if: steps.update.outputs.changed == 'true'
        env:
          APP_VERSION: ${{ steps.update.outputs.app_version }}
          CHART_VERSION: ${{ steps.update.outputs.chart_version }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            charts/multica-runtime-controller/Chart.yaml \
            charts/multica-runtime-controller/values.yaml
          git diff --cached --check
          git commit -m "chore(chart): update runtime to ${APP_VERSION} (chart ${CHART_VERSION})"
          git push origin HEAD:main
      - name: Dispatch chart release
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
      - name: Summarize
        env:
          CHANGED: ${{ steps.update.outputs.changed }}
          APP_VERSION: ${{ steps.update.outputs.app_version }}
          CHART_VERSION: ${{ steps.update.outputs.chart_version }}
        run: |
          printf 'changed=%s appVersion=%s chartVersion=%s\n' \
            "$CHANGED" "$APP_VERSION" "$CHART_VERSION" >>"$GITHUB_STEP_SUMMARY"
